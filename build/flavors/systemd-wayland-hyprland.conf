# build/flavors/systemd-wayland-hyprland.conf
#
# The active flavor on the `wayland-hyprland` branch: systemd init + Wayland
# (Hyprland compositor) + Quickshell shell, with the desktop delivered via Nix.
# This is the DEFAULT flavor (see setup-env.sh), so a plain build reproduces
# today's behaviour. Sourced by setup-env.sh after versions.env; values here may
# override pins (e.g. the kernel).
FLAVOR_INIT=systemd       # systemd | rust   (PID 1 + service manager)
FLAVOR_DISPLAY=wayland    # wayland | x11
FLAVOR_DE=hyprland        # hyprland | i3more
FLAVOR_PKG=nix            # nix | source     (how the desktop is delivered)
FLAVOR_KERNEL=6.18.34     # kernel pin for this flavor
