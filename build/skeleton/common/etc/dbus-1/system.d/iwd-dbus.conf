<!-- iwd D-Bus system-bus policy. iwd's `make install` placed this only under a
     stray build path, not the real sysroot, so iwd could not own its bus name
     on a booted system. Shipped here (/etc/dbus-1/system.d is read by dbus) so
     iwd starts. -->

<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>

  <policy user="root">
    <allow own="net.connman.iwd"/>
    <allow send_destination="net.connman.iwd"/>
    <allow send_interface="net.connman.iwd.Agent"/>
    <allow send_interface="net.connman.iwd.SignalLevelAgent"/>
    <allow send_interface="net.connman.iwd.SharedCodeAgent"/>
  </policy>

  <policy group="wheel">
    <allow send_destination="net.connman.iwd"/>
  </policy>

  <policy group="netdev">
    <allow send_destination="net.connman.iwd"/>
  </policy>

  <policy context="default">
    <deny send_destination="net.connman.iwd"/>
  </policy>

</busconfig>
