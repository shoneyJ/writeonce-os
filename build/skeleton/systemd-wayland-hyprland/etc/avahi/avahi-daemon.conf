# /etc/avahi/avahi-daemon.conf — WriteOnce mDNS responder.
#
# Purpose: advertise this host as <hostname>.local on the LAN so the workstation
# can `ssh writeonce@writeonce.local` without hunting for a DHCP address. The
# daemon only PUBLISHES — it needs no dbus/glib (built --disable-dbus). The
# resolving side (the workstation) uses its own avahi + nss-mdns.
#
# host-name follows /etc/hostname (= writeonce) when left unset; pinned here for
# clarity. domain-name=local is the mDNS link-local domain.

[server]
host-name=writeonce
domain-name=local
use-ipv4=yes
use-ipv6=yes
ratelimit-interval-usec=1000000
ratelimit-burst=1000

[publish]
publish-addresses=yes
publish-hinfo=no
publish-workstation=no
publish-domain=no

[reflector]

[rlimits]
