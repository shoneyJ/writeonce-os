# /etc/nix/nix.conf — WriteOnce single-user Nix (Tier-2 package management).
# See plan/phase-14-nix-packages.md. Nix itself is bootstrapped offline from a
# hash-locked static tarball (Phase 14); this file is its baseline config.

experimental-features = nix-command flakes

# Single-user store: no nix-daemon, no build-users group.
build-users-group =

# Binary cache (avoids local rebuilds; pulls package closures prebuilt).
substituters = https://cache.nixos.org
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

# auto-optimise-store is intentionally OFF: on the single-user store it hard-links
# into /nix/store/.links and fails with "Permission denied" on first-boot installs
# (store ownership + fs.protected_hardlinks). Dedup is not worth that breakage; run
# `nix store optimise` manually later if disk pressure warrants.

# TLS for cache.nixos.org: NIX_SSL_CERT_FILE is exported by /etc/profile.d/nix.sh
# from the nss-cacert bundled in the Nix closure (its store path carries a hash,
# so it can't be hard-coded here).

# nixpkgs resolves via Nix's built-in flake registry out of the box. To pin it
# reproducibly (recommended), during the bootstrap run e.g.:
#   nix registry pin nixpkgs github:NixOS/nixpkgs/<rev>
# so `nixpkgs#<pkg>` references are locked. Bump-and-verify the rev per
# plan/phase-14-nix-packages.md.
