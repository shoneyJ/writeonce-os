# ~/.config/hypr/hyprland.conf — WriteOnce minimal Hyprland session.
#
# Single file, no plugins, no `source =` includes. Derived from the user's
# ~/dotfiles/hypr but stripped to essentials for a first Wayland bring-up.
# Hyprland + Quickshell + the terminal come from Home Manager (see
# /etc/writeonce/home/home.nix); Home Manager symlinks this file to
# ~/.config/hypr/hyprland.conf.
#
# Tuned conservative for Broadwell (Intel HD 5500 / Gen8): no blur, software
# cursors, variable refresh. The kernel cmdline already disables i915
# PSR/FBC/DC to dodge Gen8 display hangs; software cursors complement that.

monitor = , preferred, auto, 1

# Environment exported to launched clients + the dbus activation environment.
env = QT_QPA_PLATFORM,wayland
env = XDG_CURRENT_DESKTOP,Hyprland

# Input — KEYMAP=de matches /etc/vconsole.conf and the user's dotfiles.
input {
    kb_layout = de
    # kb_layout = us
    numlock_by_default = true
    repeat_delay = 250
    repeat_rate = 35
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        clickfinger_behavior = true
    }
}

general {
    gaps_in = 4
    gaps_out = 6
    border_size = 1
    col.active_border = rgba(0db7d4ff)
    col.inactive_border = rgba(31313655)
    layout = dwindle
}

decoration {
    rounding = 6
    blur {
        enabled = false        # off: Gen8 GPU, keep compositing cheap
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = windows, 1, 3, ease
    animation = fade, 1, 3, ease
    animation = workspaces, 1, 3, ease, slide
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    vfr = true                 # variable refresh: lower idle GPU/CPU
    focus_on_activate = true
}

cursor {
    no_hardware_cursors = true # mirror WLR_NO_HARDWARE_CURSORS for Gen8
}

# ---- startup ---------------------------------------------------------------
# Export the session env (WAYLAND_DISPLAY, XDG_CURRENT_DESKTOP) to the dbus
# activation environment so portals / future user services see it.
exec-once = dbus-update-activation-environment --all
# Audio: this distro has no `systemd --user`, so start PipeWire here as the
# old .xinitrc did. (PipeWire is part of the source-built Phase 8 substrate.)
exec-once = pipewire
exec-once = wireplumber
# The shell/bar.
exec-once = quickshell -c wo

# ---- keybinds --------------------------------------------------------------
$mod = SUPER
$term = alacritty

bind = $mod, Return, exec, $term
bind = $mod, Q, killactive,
bind = $mod SHIFT, E, exit,
bind = $mod, F, fullscreen, 0
bind = $mod SHIFT, Space, togglefloating,

# focus (vim keys)
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# workspaces 1-5
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# audio keys (wpctl ships with wireplumber)
bindl = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindl = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute,        exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle

# move/resize with mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
