# Autologin the `writeonce` user on tty1. agetty --autologin execs
# `/bin/login -f writeonce` (from shadow), which skips the password but
# still runs the account + session PAM stack (pam_systemd → logind
# registers the seat/session). ~/.bash_profile then exec's startx → i3.
#
# Reset the inherited ExecStart first (the empty assignment), then set ours.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin writeonce --noclear %I $TERM
